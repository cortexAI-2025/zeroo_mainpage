# Publie le site zeeroo.fr sur GitHub Pages à chaque modification de main.
# Réglage unique : Settings → Pages → Source : « GitHub Actions », domaine : zeeroo.fr.
name: Publier zeeroo.fr

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le site
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Préparer les fichiers publiés (tout sauf README et fichiers cachés)
        run: |
          mkdir _site
          for f in *; do
            case "$f" in README.md | _site | scripts | tests | node_modules | package.json | package-lock.json) ;; *) cp -r "$f" _site/ ;; esac
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
