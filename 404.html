    <title>Page introuvable · ZeeRoo</title>
    <meta name="robots" content="noindex" />
    <script>
      // Liens commerçant des QR codes (zeroo.online/m/<slug>) et pages de l'app : vers l'app web.
      (function () {
        var p = location.pathname;
        if (/^\/(m|pro|livreur|order)\//.test(p) || p === '/pro' || p === '/livreur') {
          location.replace('https://app.zeroo.online' + p + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
